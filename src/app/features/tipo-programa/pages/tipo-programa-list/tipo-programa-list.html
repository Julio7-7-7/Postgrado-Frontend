<div class="page-container">
  <div class="header-section">
    <h2>Gestión de Tipos de Programa</h2>
    <button mat-raised-button color="primary" routerLink="nuevo">
      <mat-icon>add</mat-icon> Nuevo Tipo
    </button>
  </div>

  <div class="mat-elevation-z8 table-wrapper">
    <table mat-table [dataSource]="tiposPrograma()">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{ element.id_tipo_programa }} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{ element.nombre }} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element">
          <span class="badge" [ngClass]="element.estado">
            {{ element.estado | uppercase }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="cupo">
        <th mat-header-cell *matHeaderCellDef> Cupo Mín. </th>
        <td mat-cell *matCellDef="let element"> {{ element.cupo_minimo || 'N/A' }} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" [routerLink]="['editar', element.id_tipo_programa]" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(element.id_tipo_programa)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
    
    @if (tiposPrograma().length === 0) {
      <div class="no-data">
        <p>No se encontraron tipos de programa registrados en el sistema.</p>
      </div>
    }
  </div>
</div>
