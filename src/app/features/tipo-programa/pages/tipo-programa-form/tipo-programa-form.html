<mat-card-content>
  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-layout">
    
    <!-- Campo: Nombre -->
    <mat-form-field appearance="outline">
      <mat-label>Nombre del Programa</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: Maestría en Tecnologías">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
      <mat-error *ngIf="form.get('nombre')?.hasError('minlength')">Mínimo 3 caracteres</mat-error>
    </mat-form-field>

    <!-- Campo: Estado -->
    <mat-form-field appearance="outline">
      <mat-label>Estado del Registro</mat-label>
      <mat-select formControlName="estado">
        <mat-option value="activo">Activo</mat-option>
        <mat-option value="inactivo">Inactivo</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Campo: Cupo Mínimo -->
    <mat-form-field appearance="outline">
      <mat-label>Cupo Mínimo Requerido</mat-label>
      <input matInput type="number" formControlName="cupo_minimo" placeholder="Opcional">
      <mat-hint>Mínimo de alumnos para abrir el curso</mat-hint>
      <mat-error *ngIf="form.get('cupo_minimo')?.hasError('min')">Debe ser mayor a 0</mat-error>
    </mat-form-field>

    <!-- Botones de Acción -->
    <div class="actions">
      <button mat-button type="button" routerLink="/tipos-programa">
        Cancelar
      </button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        {{ idEditando ? 'Actualizar Registro' : 'Guardar Nuevo' }}
      </button>
    </div>

  </form>
</mat-card-content>
