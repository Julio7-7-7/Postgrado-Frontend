<div class="admin-wrapper">
  <div class="page-container">
    <div class="header-section">
      <div class="header-icon">
        <mat-icon>admin_panel_settings</mat-icon>
      </div>
      <div class="header-text">
        <h2>Administración</h2>
        <p>Gestión de roles, permisos y usuarios del sistema</p>
      </div>
    </div>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="admin-tabs">
      <a mat-tab-link
         [routerLink]="['./roles']"
         routerLinkActive
         #rla1="routerLinkActive"
         [active]="rla1.isActive">
        <mat-icon>shield</mat-icon> Roles
      </a>
      <a mat-tab-link
         [routerLink]="['./usuarios']"
         routerLinkActive
         #rla2="routerLinkActive"
         [active]="rla2.isActive">
        <mat-icon>people</mat-icon> Usuarios
      </a>
      <a mat-tab-link
         [routerLink]="['./requisitos']"
         routerLinkActive
         #rla3="routerLinkActive"
         [active]="rla3.isActive">
        <mat-icon>checklist</mat-icon> Requisitos
      </a>
      <a mat-tab-link
         [routerLink]="['./modalidades']"
         routerLinkActive
         #rla4="routerLinkActive"
         [active]="rla4.isActive">
        <mat-icon>school</mat-icon> Modalidades
      </a>
      <a mat-tab-link
         [routerLink]="['./descuentos']"
         routerLinkActive
         #rla5="routerLinkActive"
         [active]="rla5.isActive">
        <mat-icon>local_offer</mat-icon> Descuentos
      </a>
      <a mat-tab-link
         [routerLink]="['./alumnos']"
         routerLinkActive
         #rla6="routerLinkActive"
         [active]="rla6.isActive">
        <mat-icon>people</mat-icon> Alumnos
      </a>
      <a mat-tab-link
         [routerLink]="['./documentacion']"
         routerLinkActive
         #rla7="routerLinkActive"
         [active]="rla7.isActive">
        <mat-icon>description</mat-icon> Documentación
      </a>
      <a mat-tab-link
         [routerLink]="['./pagos']"
         routerLinkActive
         #rla8="routerLinkActive"
         [active]="rla8.isActive">
        <mat-icon>payments</mat-icon> Pagos
      </a>
      <a mat-tab-link
         [routerLink]="['./notas']"
         routerLinkActive
         #rla9="routerLinkActive"
         [active]="rla9.isActive">
        <mat-icon>grading</mat-icon> Notas
      </a>
    </nav>
    <mat-tab-nav-panel #tabPanel class="admin-panel">
      <router-outlet></router-outlet>
    </mat-tab-nav-panel>
  </div>
</div>
