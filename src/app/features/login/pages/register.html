<div class="login-page">
  <div class="login-container">
    <div class="brand">
      <div class="brand-emblem">
        <span class="fich">FICH</span>
        <span class="upc">UPC</span>
      </div>
      <h1>Unidad de Postgrado</h1>
      <p class="subtitle">Facultad de Ingeniería — Chaco</p>
    </div>

    <div class="form-step">
      <h2>Crear Cuenta</h2>
      <p class="role-desc">Registrate para inscribirte en programas de postgrado</p>

      <form class="login-form" (ngSubmit)="register()">
        <div class="hp-field" aria-hidden="true">
          <input type="text" [(ngModel)]="honeypot" name="website"
                 tabindex="-1" autocomplete="off">
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email"
                 placeholder="tu@correo.com" required autocomplete="email">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Cédula de Identidad</mat-label>
          <input matInput type="text" [(ngModel)]="ci" name="ci"
                 placeholder="12345678" required>
          <mat-icon matPrefix>badge</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="password" name="password"
                 placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar contraseña</mat-label>
          <input matInput [type]="showConfirmPassword ? 'text' : 'password'"
                 [(ngModel)]="confirmPassword" name="confirmPassword"
                 placeholder="Repetí tu contraseña" required autocomplete="new-password">
          <mat-icon matPrefix>lock_outline</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="showConfirmPassword = !showConfirmPassword">
            <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width"
                [disabled]="loading">
          @if (loading) {
            <ng-container><mat-icon>hourglass_top</mat-icon> Creando cuenta...</ng-container>
          } @else {
            <ng-container><mat-icon>person_add</mat-icon> Crear Cuenta</ng-container>
          }
        </button>
      </form>

      <div class="login-link">
        <p>¿Ya tenés una cuenta?</p>
        <button mat-button color="primary" (click)="goToLogin()">Iniciar Sesión</button>
      </div>
    </div>
  </div>
</div>
