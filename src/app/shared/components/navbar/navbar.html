@if (isLogged()) {
  <mat-toolbar class="navbar">
    <div class="navbar-brand" routerLink="/">
      <div class="brand-emblem">
        <span class="brand-fich">FICH</span>
        <span class="brand-upc">UPC</span>
      </div>
      <div class="brand-divider"></div>
      <div class="brand-text">
        <span class="brand-title">Unidad de Postgrado</span>
        <span class="brand-subtitle">Facultad de Ingeniería — Chaco</span>
      </div>
    </div>

    <div class="navbar-spacer"></div>

    <nav class="navbar-nav">
      @for (item of navItems(); track item.path) {
        <a
          mat-button
          [routerLink]="item.path"
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="nav-link"
          [class]="'nav-link nav-' + item.feature"
          [matTooltip]="item.label"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="navbar-actions">
      <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-btn" matTooltip="Usuario">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #profileMenu="matMenu" xPosition="before" class="profile-menu">
        <button mat-menu-item disabled>
          <mat-icon>person</mat-icon>
          <span>{{ user()?.email }}</span>
        </button>
        <button mat-menu-item disabled>
          <mat-icon>badge</mat-icon>
          <span>{{ user()?.rol }}</span>
        </button>
        @if (profileRoute()) {
          <button mat-menu-item [routerLink]="profileRoute()">
            <mat-icon>person</mat-icon>
            <span>Mi Perfil</span>
          </button>
        }
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </div>
  </mat-toolbar>
} @else {
  <mat-toolbar class="navbar public-navbar">
    <div class="navbar-brand" routerLink="/">
      <div class="brand-emblem">
        <span class="brand-fich">FICH</span>
        <span class="brand-upc">UPC</span>
      </div>
      <div class="brand-divider"></div>
      <div class="brand-text">
        <span class="brand-title">Unidad de Postgrado</span>
        <span class="brand-subtitle">Facultad de Ingeniería — Chaco</span>
      </div>
    </div>

    <div class="navbar-spacer"></div>

    <a mat-stroked-button routerLink="/login" class="login-btn">
      <mat-icon>login</mat-icon> Iniciar Sesión
    </a>
  </mat-toolbar>
}
